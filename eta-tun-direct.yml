tunnel:
  name: eta0
  mtu: 1500
  multi-queue: false
  ipv4: 198.19.0.1
  ipv6: 'fc00::1'
  icmp: 'off'

socks5:
  address: 127.0.0.1
  port: 1080
  udp: 'udp'
  pipeline: false
  mark: 0

misc:
  task-stack-size: 24576
  tcp-buffer-size: 65536
  max-session-count: 512
  connect-timeout: 30000
  tcp-read-write-timeout: 600000
  udp-read-write-timeout: 60000
  log-file: /data/local/tmp/eta-tun.log
  log-level: warn
